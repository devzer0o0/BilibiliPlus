name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      # Nothing in this repo ran the tests before, so a regression in the
      # quality/HDR logic could ship unnoticed.
      - name: Test
        run: flutter test --reporter compact

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          # Ship the AV1 VideoToolbox Avcodec; the stock framework decodes AV1 in
          # software. The step replaces, then checks the identity a re-sign cannot
          # change (UUID, the full export set, dependencies) and fails the job
          # when the bundle would ship without an AV1 decoder.
          tool/ios_av1_package.sh install build/ios/iphoneos/Runner.app
          # Fail the build if the bundle id drifted, the AV1 ABI changed, or
          # temporary diagnostics leaked into the release binary.
          tool/verify_release_constraints.sh build/ios/iphoneos/Runner.app
          ln -sf ./build/ios/iphoneos Payload
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlus_ios_${{env.version}}.ipa Payload/Runner.app

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_ios_*.ipa

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release
          path: PiliPlus_ios_*.ipa
