<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="t d">
<title id="t">Bilibili+ call to action</title><desc id="d">An anime-style closing card asking for a star and linking to releases through surrounding README links.</desc><defs>
